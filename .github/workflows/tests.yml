name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Protocol, accounting, HTTP, and repair tests
        run: python -m unittest discover -s tests -v
      - name: Confirm the repair evaluator detects all seeded bugs
        run: python -m handoff_lab.repair_tasks
